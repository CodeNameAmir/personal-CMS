# Reference Nginx configuration for Logbook
# Supports BOTH:
#   1. Static SPA hosting (serving ./dist directly)
#   2. Reverse-proxying to the Express BFF (http://127.0.0.1:3000)

server {
    listen 443 ssl http2;
    server_name log.codenameamir.ir;

    # TLS configuration managed by Certbot / host / CDN
    # ssl_certificate     /etc/letsencrypt/live/log.codenameamir.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/log.codenameamir.ir/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Replace https://YOUR_PROJECT.supabase.co with your exact Supabase project origin if preferred
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # Option A: Express BFF Reverse Proxy (pair with TRUST_PROXY=loopback or TRUST_PROXY=1 in Express)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 1m;
    }

    # Option B: Static SPA Hosting Only (comment out Option A and uncomment below)
    # root /var/www/logbook/dist;
    # index index.html;
    # location /assets/ {
    #     expires 1y;
    #     add_header Cache-Control "public, immutable" always;
    #     try_files $uri =404;
    # }
    # location / {
    #     add_header Cache-Control "no-cache" always;
    #     try_files $uri $uri/ /index.html;
    # }
}
